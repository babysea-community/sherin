name: Package Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  starter:
    name: sherin package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://your-app.example.com
      OWNER_EMAIL: owner@example.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLIC_KEY: ci_supabase_public_key
      SUPABASE_SECRET_KEY: ci_supabase_secret_key
      INFERENCE_PROVIDER: bfl
      BFL_API_KEY: ci_bfl_api_key
      BFL_API_BASE_URL: https://api.bfl.ai
      BABYSEA_API_KEY: ci_babysea_api_key
      BABYSEA_API_BASE_URL: https://api.us.babysea.ai
      STORAGE_PROVIDER: supabase-storage
      CUSTOM_USER_STORAGE_QUOTA_GB: ci
      BLOB_READ_WRITE_TOKEN: ci_blob_read_write_token
      CLOUDFLARE_R2_ACCOUNT_ID: ci
      CLOUDFLARE_R2_ACCESS_KEY_ID: ci_cloudflare_r2_access_key_id
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ci_cloudflare_r2_secret_access_key
      CLOUDFLARE_R2_BUCKET_NAME: ci
      CLOUDFLARE_R2_ENDPOINT_URL: https://example.r2.cloudflarestorage.com
      CLOUDFLARE_R2_CUSTOM_DOMAIN_URL: https://example.pub-token.r2.dev
      AWS_S3_REGION: ci
      AWS_S3_ACCESS_KEY_ID: ci_aws_s3_access_key_id
      AWS_S3_SECRET_ACCESS_KEY: ci_aws_s3_secret_access_key
      AWS_S3_BUCKET_NAME: ci
      AWS_S3_ENDPOINT_URL: https://example.s3.amazonaws.com
      NEXT_PUBLIC_SENTRY_DSN: https://example.sentry.io
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ci
      SENTRY_ORG: ci
      SENTRY_PROJECT: ci
      SENTRY_AUTH_TOKEN: ci_sentry_auth_token
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Upload coverage reports to Codecov
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          disable_search: true
      - run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Fail on high/critical CVEs in production dependencies. Dev-only CVEs
      # are surfaced by Dependabot; gating CI on them creates noise without
      # production impact.
      - name: pnpm audit (production, high+)
        run: pnpm audit --prod --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          GITLEAKS_VERSION: 8.28.0
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: gitleaks detect
        run: gitleaks detect --source . --no-banner --redact
