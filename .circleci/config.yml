version: 2.1

jobs:
  starter-package:
    docker:
      - image: cimg/node:24.11
    working_directory: ~/project
    environment:
      NEXT_PUBLIC_SITE_URL: https://your-sherin.example.com
      OWNER_EMAIL: owner@example.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLIC_KEY: ci_supabase_public_key
      SUPABASE_SECRET_KEY: ci_supabase_secret_key
      INFERENCE_PROVIDER: bfl
      BFL_API_KEY: ci_bfl_api_key
      BFL_API_BASE_URL: https://api.bfl.ai
      BABYSEA_API_KEY: ci_babysea_api_key
      BABYSEA_API_BASE_URL: https://api.us.babysea.ai
      STORAGE_PROVIDER: supabase-storage
      CUSTOM_USER_STORAGE_QUOTA_GB: ci
      BLOB_READ_WRITE_TOKEN: ci_blob_read_write_token
      CLOUDFLARE_R2_ACCOUNT_ID: ci
      CLOUDFLARE_R2_ACCESS_KEY_ID: ci_cloudflare_r2_access_key_id
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ci_cloudflare_r2_secret_access_key
      CLOUDFLARE_R2_BUCKET_NAME: ci
      CLOUDFLARE_R2_ENDPOINT_URL: https://example.r2.cloudflarestorage.com
      CLOUDFLARE_R2_CUSTOM_DOMAIN_URL: https://example.pub-token.r2.dev
      AWS_S3_REGION: ci
      AWS_S3_ACCESS_KEY_ID: ci_aws_s3_access_key_id
      AWS_S3_SECRET_ACCESS_KEY: ci_aws_s3_secret_access_key
      AWS_S3_BUCKET_NAME: ci
      AWS_S3_ENDPOINT_URL: https://example.s3.amazonaws.com
      NEXT_PUBLIC_SENTRY_DSN: https://example.sentry.io
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ci
      SENTRY_ORG: ci
      SENTRY_PROJECT: ci
      SENTRY_AUTH_TOKEN: ci_sentry_auth_token
    steps:
      - checkout
      - restore_cache:
          keys:
            - sherin-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Set up pnpm
          command: |
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            npm install --global --prefix "$HOME/.local" pnpm@10.19.0
            pnpm config set store-dir ~/.pnpm-store
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: sherin-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - run:
          name: Format check
          command: pnpm format
      - run:
          name: Lint
          command: pnpm lint
      - run:
          name: Typecheck
          command: pnpm typecheck
      - run:
          name: Test coverage
          command: pnpm test:coverage
      - persist_to_workspace:
          root: .
          paths:
            - coverage/lcov.info
      - run:
          name: Build
          command: pnpm build

  dependency-audit:
    docker:
      - image: cimg/node:24.11
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - sherin-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Set up pnpm
          command: |
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            npm install --global --prefix "$HOME/.local" pnpm@10.19.0
            pnpm config set store-dir ~/.pnpm-store
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: sherin-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - run:
          name: pnpm audit production high+
          command: pnpm audit --prod --audit-level=high

  codecov-upload:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Upload coverage to Codecov
          command: |
            if [ -z "${CODECOV_TOKEN:-}" ]; then
              echo "CODECOV_TOKEN is not configured in CircleCI; skipping trusted main coverage upload."
              exit 0
            fi
            curl -fsSLO https://cli.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov --auto-load-params-from CircleCI upload-process \
              -Z \
              -t "$CODECOV_TOKEN" \
              -C "$CIRCLE_SHA1" \
              -f coverage/lcov.info \
              --disable-search

workflows:
  package-check:
    jobs:
      - starter-package
      - dependency-audit
      - codecov-upload:
          requires:
            - starter-package
          filters:
            branches:
              only: main
